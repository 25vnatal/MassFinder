<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="Find Catholic parishes and Mass times near you in Karnataka. Search by town, pincode, day, time and language.">
<meta name="theme-color" content="#2F5BEA">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⛪</text></svg>">
<title>Find a Mass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="vendor/maplibre-gl/maplibre-gl.css">
<script src="vendor/maplibre-gl/maplibre-gl.js"></script>
<script src="config.js"></script>
<style>
:root {
  color-scheme: light;
  --blue: #2F5BEA; --blue-deep: #1F44C4; --blue-soft: #EDF2FF;
  --amber: #F5A524; --amber-soft: #FFF4DA; --amber-ink: #8A5A00;
  --ink: #0B1B33; --muted: #56677F; --faint: #8593A8; --line: #E1E7F0; --soft: #F1F4F9; --surface: #FFFFFF;
  --sea: #CFE3F3; --land: #FFFFFF; --land2: #EEF2F6; --distline: #D3DDE9; --dot: #A3B0C2;
  --accent: var(--blue); --gold: var(--amber); --season: #2E8B57; --season-bg: #E6F4EA; --season-ink: #23683F;
  --sans: 'Plus Jakarta Sans', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --panel-w: 420px;
  box-sizing: border-box;
}
:root[data-season="violet"] { --season: #7B4FC2; --season-bg: #F1EAFB; --season-ink: #5B3796; }
:root[data-season="gold"] { --season: #D18A00; --season-bg: #FFF4DA; --season-ink: #7A5200; }
*, *::before, *::after { box-sizing: inherit; }
html, body { height: 100%; margin: 0; }
body { font: 15px/1.45 var(--sans); color: var(--ink); background: var(--sea); -webkit-font-smoothing: antialiased; overflow: hidden; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid color-mix(in srgb, var(--blue) 55%, transparent); outline-offset: 2px; }
a { color: var(--blue); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* map fills the window */
#map { position: fixed; inset: 0; }

/* floating panel */
.panel {
  position: fixed; z-index: 5; top: calc(20px + env(safe-area-inset-top, 0px)); left: 20px; bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  width: var(--panel-w); display: flex; flex-direction: column;
  background: rgba(255, 255, 255, 0.94); backdrop-filter: blur(18px) saturate(1.2); -webkit-backdrop-filter: blur(18px) saturate(1.2);
  border-radius: 24px; box-shadow: 0 20px 50px rgba(11, 27, 51, 0.18), 0 0 0 1px rgba(11, 27, 51, 0.06);
}
.phead { padding: 20px 20px 14px; display: flex; flex-direction: column; gap: 12px; }
.brandrow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand .mark { width: 36px; height: 36px; border-radius: 11px; background: var(--blue); display: grid; place-items: center; flex: none; }
.brand h1 { margin: 0; font-size: 19px; font-weight: 800; letter-spacing: -0.02em; }
.season { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: var(--season-ink); background: var(--season-bg); padding: 5px 10px; border-radius: 999px; white-space: nowrap; }
.season i { width: 7px; height: 7px; border-radius: 50%; background: var(--season); }

.searchrow { display: flex; gap: 8px; }
.searchbox { position: relative; flex: 1; }
.searchbox svg.ic { position: absolute; left: 15px; top: 15px; width: 18px; height: 18px; color: var(--muted); pointer-events: none; }
.searchbox input { width: 100%; height: 48px; border: 0; border-radius: 14px; background: var(--soft); padding: 0 40px 0 44px; font-size: 15px; font-weight: 600; }
.searchbox input::placeholder { color: var(--faint); font-weight: 500; }
.searchbox input:focus { outline: 2px solid var(--blue); background: var(--surface); }
.searchbox .clear { position: absolute; right: 8px; top: 9px; width: 30px; height: 30px; border: 0; border-radius: 50%; background: transparent; color: var(--muted); cursor: pointer; display: none; place-items: center; }
.searchbox .clear:hover { background: var(--line); }
.searchbox.has .clear { display: grid; }
.locate { width: 48px; height: 48px; flex: none; border: 0; border-radius: 14px; background: var(--blue-soft); color: var(--blue); display: grid; place-items: center; cursor: pointer; }
.locate:hover { background: #DFE8FF; }
.locate.on { background: var(--blue); color: #fff; }
.suggest { position: absolute; z-index: 30; left: 0; right: 0; top: 54px; margin: 0; padding: 6px; list-style: none; background: var(--surface); border-radius: 16px; box-shadow: 0 16px 40px rgba(11, 27, 51, 0.2), 0 0 0 1px rgba(11, 27, 51, 0.06); display: none; max-height: 340px; overflow: auto; }
.suggest.open { display: block; }
.suggest li { display: flex; justify-content: space-between; gap: 12px; padding: 9px 12px; border-radius: 10px; cursor: pointer; font-weight: 600; }
.suggest li small { color: var(--muted); font-weight: 500; white-space: nowrap; }
.suggest li[aria-selected="true"], .suggest li:hover { background: var(--blue-soft); }
.msg { margin: 0; font-size: 13px; color: var(--muted); background: var(--soft); border-radius: 10px; padding: 8px 12px; }
.msg:empty { display: none; }

.seg { position: relative; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 4px; background: var(--soft); padding: 4px; border-radius: 13px; }
.seg button { height: 36px; border: 0; border-radius: 10px; background: transparent; font-size: 13.5px; font-weight: 600; color: var(--muted); cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; justify-content: center; gap: 4px; padding: 0 6px; }
.seg button:hover { color: var(--ink); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); font-weight: 700; box-shadow: 0 1px 3px rgba(11, 27, 51, 0.14); }

.pills { display: flex; gap: 8px; flex-wrap: wrap; }
.pillwrap { position: relative; }
.pill { height: 36px; padding: 0 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; }
.pill:hover { border-color: #C9D4E6; }
.pill.active { border-color: var(--blue); background: var(--blue-soft); color: var(--blue-deep); }
.pill svg { width: 15px; height: 15px; flex: none; }
.pill .chev { width: 12px; height: 12px; opacity: .7; }
.menu { position: absolute; z-index: 40; top: 42px; left: 0; min-width: 210px; background: var(--surface); border-radius: 14px; padding: 6px; box-shadow: 0 16px 40px rgba(11, 27, 51, 0.2), 0 0 0 1px rgba(11, 27, 51, 0.06); display: none; }
.menu.open { display: block; }
.menu button { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 12px; height: 38px; padding: 0 10px; border: 0; background: transparent; border-radius: 9px; font-size: 14px; font-weight: 600; cursor: pointer; text-align: left; }
.menu button:hover { background: var(--soft); }
.menu button small { color: var(--muted); font-weight: 500; }
.menu button .tick { width: 18px; height: 18px; border-radius: 6px; border: 1.5px solid #C9D4E6; display: grid; place-items: center; flex: none; }
.menu button[aria-checked="true"] .tick { background: var(--blue); border-color: var(--blue); }
.menu button[aria-checked="true"] .tick::after { content: ""; width: 8px; height: 5px; border: 2px solid #fff; border-top: 0; border-right: 0; transform: rotate(-45deg) translate(1px, -1px); }
.menu button.radio .tick { border-radius: 50%; }
.menu button.radio[aria-checked="true"] .tick::after { width: 6px; height: 6px; border: 0; border-radius: 50%; background: #fff; transform: none; }
.menu hr { border: 0; border-top: 1px solid var(--line); margin: 6px 4px; }
.menu .mnote { font-size: 12.5px; color: var(--muted); padding: 4px 10px 6px; margin: 0; max-width: 240px; }

.listhead { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 14px 20px 10px; border-top: 1px solid #EEF1F6; }
.count { margin: 0; font-size: 15px; font-weight: 700; line-height: 1.3; }
.sortseg { flex: none; grid-auto-columns: auto; padding: 3px; border-radius: 11px; }
.sortseg button { height: 30px; font-size: 12.5px; padding: 0 10px; border-radius: 8px; }

.scroll { flex: 1; min-height: 0; overflow: auto; padding: 0 12px 14px; overscroll-behavior: contain; }
.note { margin: 0 8px 10px; font-size: 13px; color: var(--muted); background: var(--soft); border-radius: 12px; padding: 10px 12px; }
.results { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.card { width: 100%; text-align: left; border: 1px solid #E8ECF3; background: var(--surface); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 10px; cursor: pointer; }
.card:hover { border-color: #C9D4E6; box-shadow: 0 4px 14px rgba(11, 27, 51, 0.06); }
.card.sel { border: 2px solid var(--blue); padding: 13px; box-shadow: 0 6px 18px rgba(47, 91, 234, 0.14); }
.card .top { display: flex; justify-content: space-between; gap: 12px; width: 100%; }
.card h3 { margin: 0; font-size: 16px; font-weight: 700; letter-spacing: -0.01em; line-height: 1.3; }
.card .place { font-size: 13px; color: var(--muted); margin-top: 2px; }
.km { flex: none; height: fit-content; font-size: 12.5px; font-weight: 700; color: var(--blue); background: var(--blue-soft); border-radius: 999px; padding: 4px 9px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.times { display: flex; gap: 6px; flex-wrap: wrap; }
.t { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink); background: var(--amber-soft); border-radius: 9px; padding: 4px 9px; font-variant-numeric: tabular-nums; }
.t b { color: var(--amber-ink); font-weight: 800; }
.t .lg { font-size: 11.5px; font-weight: 700; color: var(--blue-deep); background: var(--surface); border-radius: 6px; padding: 1px 6px; }
.t .vn { color: var(--muted); font-size: 12px; }
.t.past { background: transparent; box-shadow: inset 0 0 0 1px var(--line); color: var(--faint); }
.t.past b { color: var(--faint); }
.t.more { background: transparent; color: var(--muted); padding: 4px 2px; }
.nottimes { font-size: 13px; color: var(--faint); }
.empty { text-align: center; color: var(--muted); padding: 30px 16px; }
.empty p { margin: 0 0 12px; }
.btn { height: 40px; padding: 0 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-weight: 700; font-size: 14px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 7px; text-decoration: none; color: var(--ink); white-space: nowrap; }
.btn:hover { border-color: #C9D4E6; }
.btn.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
.btn.primary:hover { background: var(--blue-deep); }
.btn.icon { width: 40px; padding: 0; background: var(--blue-soft); border-color: transparent; color: var(--blue); }
.btn svg { width: 16px; height: 16px; }
.moreBtn { display: flex; margin: 10px auto 4px; }

/* parish detail */
.detail { padding: 6px 8px 8px; display: flex; flex-direction: column; gap: 14px; }
.back { align-self: flex-start; border: 0; background: var(--soft); color: var(--ink); border-radius: 999px; height: 34px; padding: 0 12px 0 8px; font-weight: 700; font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
.back:hover { background: var(--line); }
.detail h2 { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.2; }
.detail .sub { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.label { font-size: 11.5px; font-weight: 800; letter-spacing: 0.07em; color: var(--muted); text-transform: uppercase; margin: 4px 0 0; }
.week { display: flex; flex-direction: column; background: var(--surface); border: 1px solid #E8ECF3; border-radius: 16px; overflow: hidden; }
.day { display: grid; grid-template-columns: 92px 1fr; gap: 10px; padding: 10px 14px; border-top: 1px solid #EEF1F6; }
.day:first-child { border-top: 0; }
.day.today { background: var(--amber-soft); }
.day .dn { font-weight: 700; font-size: 13.5px; color: var(--muted); padding-top: 2px; }
.day.today .dn { color: var(--amber-ink); }
.svcs { display: flex; flex-direction: column; gap: 6px; }
.svc { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.svc .tm { font-weight: 800; font-size: 14px; min-width: 64px; font-variant-numeric: tabular-nums; }
.svc .lg { font-size: 12px; font-weight: 700; color: var(--blue-deep); background: var(--blue-soft); border-radius: 6px; padding: 2px 7px; }
.svc .lg.none { color: var(--faint); background: var(--soft); font-weight: 600; }
.svc .ty { font-size: 12px; font-weight: 700; color: var(--amber-ink); background: var(--amber-soft); border-radius: 6px; padding: 2px 7px; }
.day.today .svc .ty { background: var(--surface); }
.svc .mt { font-size: 12.5px; color: var(--muted); flex-basis: 100%; padding-left: 72px; margin-top: -2px; }
.none-day { font-size: 13px; color: var(--faint); padding-top: 2px; }
.facts { margin: 0; display: grid; grid-template-columns: 96px 1fr; gap: 8px 12px; font-size: 14px; background: var(--surface); border: 1px solid #E8ECF3; border-radius: 16px; padding: 14px; }
.facts dt { color: var(--muted); font-weight: 600; }
.facts dd { margin: 0; overflow-wrap: anywhere; }
.hint { margin: 0; font-size: 13px; color: var(--muted); }

/* map pieces */
.cluster { border: 3px solid #fff; padding: 0; cursor: pointer; border-radius: 50%; display: grid; place-items: center; font: 800 14px/1 var(--sans); color: #fff; background: var(--blue); box-shadow: 0 0 0 6px rgba(47, 91, 234, 0.22), 0 4px 12px rgba(11, 27, 51, 0.28); }
.cluster:hover { background: var(--blue-deep); }
.cluster.s { width: 36px; height: 36px; } .cluster.m { width: 44px; height: 44px; font-size: 15px; } .cluster.l { width: 54px; height: 54px; font-size: 16px; }
.maplibregl-ctrl-top-right { top: calc(20px + env(safe-area-inset-top, 0px)); right: 20px; }
.maplibregl-ctrl-top-right .maplibregl-ctrl { margin: 0 0 10px 0; }
.maplibregl-ctrl-group { border-radius: 14px; box-shadow: 0 6px 20px rgba(11, 27, 51, 0.14); overflow: hidden; }
.maplibregl-ctrl-group button { width: 44px; height: 44px; }
.fitctl button { font-size: 17px; }
.maplibregl-ctrl-attrib { font-size: 11px; }
.maplibregl-popup-content { padding: 0; border-radius: 20px; box-shadow: 0 18px 44px rgba(11, 27, 51, 0.24); font-family: var(--sans); color: var(--ink); }
.maplibregl-popup-tip { display: none; }
.maplibregl-popup-close-button { width: 30px; height: 30px; top: 14px; right: 14px; border-radius: 50%; background: var(--soft); color: var(--muted); font-size: 18px; line-height: 1; }
.maplibregl-popup-close-button:hover { background: var(--line); }
.pop { padding: 18px; display: flex; flex-direction: column; gap: 12px; width: 330px; max-width: 100%; }
.pop h3 { margin: 0 34px 0 0; font-size: 17px; font-weight: 800; letter-spacing: -0.01em; line-height: 1.25; }
.pop .place { margin: 3px 0 0; font-size: 13px; color: var(--muted); }
.pop .fd { font-size: 12.5px; color: var(--muted); margin: -4px 0 0; }
.pop .acts { display: flex; gap: 8px; }
.pop .acts .btn { height: 42px; padding: 0 13px; }
.pop .acts .btn.primary { flex: 1; }

/* phone: the panel becomes a bottom sheet under a floating search bar */
@media (max-width: 760px) {
  .panel { top: auto; left: 0; right: 0; bottom: 0; width: auto; height: 56vh; border-radius: 24px 24px 0 0; backdrop-filter: none; -webkit-backdrop-filter: none; background: var(--surface); padding-bottom: env(safe-area-inset-bottom, 0px); transition: height .25s ease; }
  .panel.full { height: calc(100% - 84px - env(safe-area-inset-top, 0px)); }
  .handle { display: block; }
  .brandrow { display: none; }
  .phead { padding: 4px 14px 10px; gap: 10px; }
  .searchrow { position: fixed; z-index: 6; top: calc(12px + env(safe-area-inset-top, 0px)); left: 12px; right: 12px; }
  .searchbox input { background: var(--surface); box-shadow: 0 6px 20px rgba(11, 27, 51, 0.16); }
  .locate { background: var(--blue); color: #fff; box-shadow: 0 6px 20px rgba(47, 91, 234, 0.35); }
  .pills { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin: 0 -14px; padding: 0 14px; }
  .pills::-webkit-scrollbar { display: none; }
  .menu { position: fixed; left: 12px; right: 12px; top: auto; bottom: 12px; min-width: 0; padding: 10px; }
  .menu button { height: 46px; font-size: 15px; }
  .listhead { padding: 10px 14px 8px; }
  .seg button { font-size: 12.5px; padding: 0 4px; }
  .scroll { padding: 0 10px 14px; }
  .maplibregl-ctrl-top-right { top: calc(76px + env(safe-area-inset-top, 0px)); right: 12px; }
  .msg { position: fixed; z-index: 6; top: calc(68px + env(safe-area-inset-top, 0px)); left: 12px; right: 70px; background: var(--surface); box-shadow: 0 6px 20px rgba(11, 27, 51, 0.14); }
}
.handle { display: none; width: 100%; height: 22px; border: 0; background: transparent; cursor: pointer; padding: 0; flex: none; }
.handle::before { content: ""; display: block; width: 40px; height: 5px; border-radius: 3px; background: #D5DCE6; margin: 9px auto 0; }
@media (prefers-reduced-motion: reduce) { .panel { transition: none; } }
.seg .menu { left: auto; right: 0; }
</style>
</head>
<body>
<div id="map" aria-label="Map of parishes" role="region"></div>

<aside class="panel" id="panel" aria-label="Find a Mass">
  <button class="handle" id="handle" type="button" aria-label="Expand or collapse the list"></button>
  <div class="phead">
    <div class="brandrow">
      <div class="brand">
        <div class="mark"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v5M9.5 4.5h5"/><path d="M5 21V12l7-5 7 5v9"/><path d="M10 21v-4a2 2 0 0 1 4 0v4"/></svg></div>
        <h1>Find a Mass</h1>
      </div>
      <span class="season" id="season"><i></i><span></span></span>
    </div>

    <div class="searchrow" role="search">
      <div class="searchbox" id="sbox">
        <svg class="ic" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="text" autocomplete="off" placeholder="Town, pincode or parish" aria-label="Search by place, pincode or parish name" role="combobox" aria-expanded="false" aria-controls="sugg" aria-autocomplete="list">
        <button class="clear" id="qclear" type="button" aria-label="Clear search"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
        <ul class="suggest" id="sugg" role="listbox"></ul>
      </div>
      <button class="locate" id="locate" type="button" aria-label="Use my location" title="Use my location"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11 21 3l-8 18-2-8z"/></svg></button>
    </div>
    <p class="msg" id="msg" role="status"></p>

    <div class="seg" id="days" role="group" aria-label="Day"></div>
    <div class="pills" id="pills"></div>
  </div>

  <div class="listhead">
    <h2 class="count" id="count"></h2>
    <div class="seg sortseg" id="sort" role="group" aria-label="Sort results"></div>
  </div>
  <div class="scroll" id="list" aria-live="polite"></div>
</aside>

<script>
(async function () {
'use strict';
const $ = (s) => document.querySelector(s);
$('#list').innerHTML = '<p class="note">Loading parishes…</p>';
let SRC;
try {
  SRC = await fetch('data/parishes.json', { cache: 'no-cache' }).then((r) => { if (!r.ok) throw new Error('parishes.json returned ' + r.status); return r.json(); });
} catch (err) {
  $('#list').innerHTML = '<div class="empty"><p>The parish directory couldn’t be loaded.</p><p>' +
    (location.protocol === 'file:' ? 'Open this page through a web server (see README), not by double-clicking the file.' : 'Check your connection and reload the page.') + '</p></div>';
  console.error(err);
  return;
}
/* convert the published schema (scripts/build_json.py) into the app's working shape */
const DATA = { p: SRC.parishes.map((p) => ({
  id: p.id, n: p.name, pt: p.patron, fd: p.feast_day, dio: p.diocese.name,
  ad: p.address.line, loc: p.address.locality, city: p.address.city, dist: p.address.district,
  pin: p.address.pincode, st: p.address.state,
  lat: p.geo.lat, lng: p.geo.lng, gp: p.geo.precision, gs: p.geo.status,
  ph: p.contact.phones || [], em: p.contact.email, web: p.contact.website,
  est: p.established, cat: p.catholics,
  m: (p.masses || []).map((x) => [x.day.slice(0, 3), x.time, x.type, x.languages || [], x.venue, x.recurrence, x.notes]),
})) };
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const DAYNAMES = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
const DAYSHORT = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const MASSLIKE = new Set(['Mass', 'Vigil Mass', 'Novena']);
const TIMES = [
  { id: 'early', label: 'Before 7 am', from: 0, to: 420 },
  { id: 'morning', label: '7 am – noon', from: 420, to: 720 },
  { id: 'afternoon', label: 'Noon – 5 pm', from: 720, to: 1020 },
  { id: 'evening', label: 'After 5 pm', from: 1020, to: 1440 },
];

/* ---------- liturgical season colours the accent ---------- */
function easter(y) {
  const a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4,
    f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30,
    i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451),
    month = Math.floor((h + l - 7 * m + 114) / 31), day = ((h + l - 7 * m + 114) % 31) + 1;
  return new Date(y, month - 1, day);
}
function season(now) {
  const y = now.getFullYear(), day = 864e5, t = new Date(y, now.getMonth(), now.getDate()).getTime();
  const e = easter(y).getTime();
  const xmas = new Date(y, 11, 25), dow = xmas.getDay();
  const advent = xmas.getTime() - (dow === 0 ? 28 : dow + 21) * day;
  if (t >= xmas.getTime() || t <= new Date(y, 0, 13).getTime()) return ['Christmas season', 'gold'];
  if (t >= advent) return ['Advent', 'violet'];
  if (t >= e - 46 * day && t < e) return ['Lent', 'violet'];
  if (t >= e && t <= e + 49 * day) return ['Easter season', 'gold'];
  return ['Ordinary Time', 'green'];
}
const NOW = new Date();
const [seasonName, seasonColour] = season(NOW);
document.documentElement.dataset.season = seasonColour;
$('#season span').textContent = seasonName;
$('#season').title = NOW.toLocaleDateString('en-IN', { weekday: 'long', day: 'numeric', month: 'long' }) + ', ' + seasonName;

/* ---------- data prep ---------- */
const parishes = DATA.p.map((p) => {
  const services = p.m.map((m) => {
    const [h, mi] = m[1].split(':').map(Number);
    return { day: DAYSHORT.indexOf(m[0]), min: h * 60 + mi, type: m[2], langs: m[3] || [], venue: m[4], rec: m[5], notes: m[6] };
  }).filter((s) => s.day >= 0);
  const langs = [...new Set(services.flatMap((s) => s.langs))];
  return Object.assign(p, { services, langs, hasCoords: p.lat != null && p.lng != null });
});
const withTimesCount = parishes.filter((p) => p.services.length).length;


function km(a, b) {
  const R = 6371, r = Math.PI / 180, dLat = (b.lat - a.lat) * r, dLng = (b.lng - a.lng) * r;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
const titleCase = (s) => s.replace(/\w\S*/g, (w) => w[0].toUpperCase() + w.slice(1).toLowerCase());

/* places index for the search box */
const places = new Map();
function addPlace(label, sub, kind, p) {
  if (!label || !p.hasCoords) return;
  label = String(label).trim().replace(/\s+/g, ' ');
  if (label.length < 3 || /^\d/.test(label) && kind !== 'pincode') return;
  const key = kind + ':' + label.toLowerCase();
  const e = places.get(key) || { label, sub, kind, lat: 0, lng: 0, n: 0 };
  e.lat += p.lat; e.lng += p.lng; e.n++;
  places.set(key, e);
}
parishes.forEach((p) => {
  const dist = p.dist || '';
  addPlace(p.loc && titleCase(p.loc).replace(/\b(Tk|Po|P\.o\.)\b\.?/gi, '').trim(), dist || p.dio.replace(/^(Arch)?[Dd]iocese of /, ''), 'area', p);
  addPlace(p.city, 'City', 'city', p);
  addPlace(dist, 'District', 'district', p);
  addPlace(p.pin, 'Pincode', 'pincode', p);
  String(p.ad || '').split(/[,(]/).forEach((seg) => {
    const t = seg.replace(/[–-]?\s*\d{3}\s?\d{3}.*$/, '').replace(/\b(P\.?\s?O\.?|Post|Via|Tq|Tk|Taluk|Dist\.?|District|Hobli)\b\.?/gi, '').replace(/[.)]/g, ' ').trim();
    if (/^[A-Za-z][A-Za-z .'-]{2,24}$/.test(t) && !/church|road|cross|street|main|layout|stage|block|box|no\b|shrine|parish/i.test(t)) addPlace(titleCase(t), 'Town or area', 'town', p);
  });
});
/* merge duplicates across kinds: keep the entry with most parishes */
const merged = new Map();
for (const e of places.values()) {
  const k = e.label.toLowerCase();
  if (!merged.has(k) || merged.get(k).n < e.n) merged.set(k, e);
}
places.clear(); merged.forEach((v, k) => places.set(k, v));
const PLACES = [...places.values()].map((e) => ({ ...e, lat: e.lat / e.n, lng: e.lng / e.n }));

/* ---------- state ---------- */
const state = {
  origin: null, radius: 25, day: 'any', times: new Set(), langs: new Set(),
  devotions: false, withTimes: false, sort: 'nearest', selected: null, limit: 50,
};
const todayIdx = NOW.getDay(), nowMin = NOW.getHours() * 60 + NOW.getMinutes();

function targetDay() {
  if (state.day === 'today') return todayIdx;
  if (state.day === 'tomorrow') return (todayIdx + 1) % 7;
  return state.day === 'any' ? null : state.day;
}
function scheduleActive() { return state.day !== 'any' || state.times.size || state.langs.size; }
function minsUntil(s) {
  let d = ((s.day - todayIdx + 7) % 7) * 1440 + (s.min - nowMin);
  if (d < -15) d += 7 * 1440;
  return d;
}
function svcMatches(s) {
  if (!state.devotions && !MASSLIKE.has(s.type)) return false;
  const td = targetDay();
  if (td != null && s.day !== td) return false;
  if (state.times.size && !TIMES.some((t) => state.times.has(t.id) && s.min >= t.from && s.min < t.to)) return false;
  if (state.langs.size && !s.langs.some((l) => state.langs.has(l))) return false;
  return true;
}

function compute() {
  const active = scheduleActive();
  const out = [];
  for (const p of parishes) {
    const svcs = p.services.filter(svcMatches).sort((a, b) => minsUntil(a) - minsUntil(b));
    if ((active || state.withTimes) && !svcs.length) continue;
    let d = null;
    if (state.origin) {
      if (!p.hasCoords) continue;
      d = km(state.origin, p);
      if (state.radius && d > state.radius) continue;
    }
    out.push({ p, svcs, d, next: svcs.length ? minsUntil(svcs[0]) : Infinity });
  }
  const mode = sortMode();
  out.sort(mode === 'nearest' ? (a, b) => a.d - b.d
    : mode === 'soonest' ? (a, b) => a.next - b.next || (a.d ?? 0) - (b.d ?? 0)
    : (a, b) => a.p.n.localeCompare(b.p.n));
  return out;
}
function sortMode() {
  if (state.sort === 'nearest' && state.origin) return 'nearest';
  return 'soonest';
}

/* ---------- icons ---------- */
const ICON = {
  chev: '<svg class="chev" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="m6 9 6 6 6-6"/></svg>',
  clock: '<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  globe: '<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>',
  ring: '<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2"/></svg>',
  sliders: '<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M7 12h10M10 18h4"/></svg>',
  nav: '<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11 21 3l-8 18-2-8z"/></svg>',
  phone: '<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg>',
  back: '<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="m15 18-6-6 6-6"/></svg>',
};

/* ---------- day switch and filter dropdowns ---------- */
const LANG_COUNTS = {};
parishes.forEach((p) => p.services.forEach((s) => s.langs.forEach((l) => { LANG_COUNTS[l] = (LANG_COUNTS[l] || 0) + 1; })));
const LANGS = Object.keys(LANG_COUNTS).sort();
const RADII = [5, 10, 25, 50, 100, 0];
let openMenu = null;

function renderFilters() {
  /* day switch: Any day, Today, Tomorrow, Sunday (when it is neither), and a menu for the other days */
  const tmr = (todayIdx + 1) % 7;
  const segs = [['any', 'Any day'], ['today', 'Today'], ['tomorrow', 'Tomorrow']];
  if (todayIdx !== 0 && tmr !== 0) segs.push([0, 'Sunday']);
  const quick = new Set(segs.map(([v]) => v));
  const otherDays = [1, 2, 3, 4, 5, 6, 0].filter((d) => d !== todayIdx && d !== tmr && !quick.has(d));
  const otherPicked = typeof state.day === 'number' && !quick.has(state.day);
  $('#days').innerHTML = segs.map(([v, l]) => `<button type="button" data-day="${v}" aria-pressed="${state.day === v}">${l}</button>`).join('') +
    `<div class="pillwrap" style="display:contents"><button type="button" id="moreDays" aria-haspopup="true" aria-pressed="${otherPicked}">${otherPicked ? DAYSHORT[state.day] : 'More'}${ICON.chev}</button></div>`;
  $('#days').querySelectorAll('[data-day]').forEach((b) => b.addEventListener('click', () => {
    const v = b.dataset.day; state.day = /^\d$/.test(v) ? +v : v; update();
  }));
  $('#moreDays').addEventListener('click', (e) => {
    e.stopPropagation();
    showMenu($('#moreDays'), otherDays.map((d) => ({ label: DAYNAMES[d], radio: true, on: state.day === d, pick: () => { state.day = d; update(); } })));
  });

  /* dropdown pills */
  const timeLabel = !state.times.size ? 'Any time' : state.times.size === 1 ? TIMES.find((t) => state.times.has(t.id)).label : state.times.size + ' times';
  const langLabel = !state.langs.size ? 'Any language' : [...state.langs].join(', ');
  const distLabel = state.radius ? `Within ${state.radius} km` : 'Any distance';
  const extras = (state.devotions ? 1 : 0) + (state.withTimes ? 1 : 0);
  $('#pills').innerHTML = `
    <div class="pillwrap"><button type="button" class="pill${state.times.size ? ' active' : ''}" id="pTime" aria-haspopup="true">${ICON.clock}${esc(timeLabel)}${ICON.chev}</button></div>
    <div class="pillwrap"><button type="button" class="pill${state.langs.size ? ' active' : ''}" id="pLang" aria-haspopup="true">${ICON.globe}${esc(langLabel)}${ICON.chev}</button></div>
    <div class="pillwrap"><button type="button" class="pill${state.origin ? ' active' : ''}" id="pDist" aria-haspopup="true">${ICON.ring}${esc(distLabel)}${ICON.chev}</button></div>
    <div class="pillwrap"><button type="button" class="pill${extras ? ' active' : ''}" id="pMore" aria-haspopup="true">${ICON.sliders}More${extras ? ' (' + extras + ')' : ''}</button></div>`;
  $('#pTime').addEventListener('click', (e) => { e.stopPropagation(); showMenu(e.currentTarget, [
    { label: 'Any time', radio: true, on: !state.times.size, pick: () => { state.times.clear(); update(); } },
    { sep: true },
    ...TIMES.map((t) => ({ label: t.label, on: state.times.has(t.id), keep: true, pick: () => { state.times.has(t.id) ? state.times.delete(t.id) : state.times.add(t.id); update(); } })),
  ]); });
  $('#pLang').addEventListener('click', (e) => { e.stopPropagation(); showMenu(e.currentTarget, [
    { label: 'Any language', radio: true, on: !state.langs.size, pick: () => { state.langs.clear(); update(); } },
    { sep: true },
    ...LANGS.map((l) => ({ label: l, small: LANG_COUNTS[l] + (LANG_COUNTS[l] === 1 ? ' Mass' : ' Masses'), on: state.langs.has(l), keep: true, pick: () => { state.langs.has(l) ? state.langs.delete(l) : state.langs.add(l); update(); } })),
    { note: 'Language is listed for only some Masses so far.' },
  ]); });
  $('#pDist').addEventListener('click', (e) => { e.stopPropagation(); showMenu(e.currentTarget, [
    ...(state.origin ? [] : [{ note: 'Search a place or use your location to filter by distance.' }]),
    ...RADII.map((r) => ({ label: r ? `Within ${r} km` : 'Any distance', radio: true, on: state.radius === r, pick: () => { state.radius = r; update(true); } })),
  ]); });
  $('#pMore').addEventListener('click', (e) => { e.stopPropagation(); showMenu(e.currentTarget, [
    { label: 'Only parishes with Mass times', on: state.withTimes, keep: true, pick: () => { state.withTimes = !state.withTimes; update(); } },
    { label: 'Include adoration and rosary', on: state.devotions, keep: true, pick: () => { state.devotions = !state.devotions; update(); } },
  ]); });
}

function showMenu(anchor, items) {
  const wasOpenHere = openMenu && openMenu.anchor === anchor.id;
  closeMenu();
  if (wasOpenHere) return;
  const m = document.createElement('div');
  m.className = 'menu open'; m.setAttribute('role', 'menu');
  m.innerHTML = items.map((it, i) => it.sep ? '<hr>' : it.note ? `<p class="mnote">${esc(it.note)}</p>`
    : `<button type="button" role="${it.radio ? 'menuitemradio' : 'menuitemcheckbox'}" class="${it.radio ? 'radio' : ''}" aria-checked="${!!it.on}" data-i="${i}"><span>${esc(it.label)}${it.small ? ` <small>${esc(it.small)}</small>` : ''}</span><span class="tick"></span></button>`).join('');
  anchor.parentElement.append(m);
  const anchorId = anchor.id;
  m.querySelectorAll('button').forEach((b) => b.addEventListener('click', (e) => {
    e.stopPropagation();
    const it = items[+b.dataset.i];
    it.pick();
    if (it.keep) { const a = document.getElementById(anchorId); if (a) { openMenu = null; a.click(); } }
    else closeMenu();
  }));
  openMenu = { el: m, anchor: anchorId };
  const first = m.querySelector('button'); if (first) first.focus({ preventScroll: true });
}
function closeMenu() { if (openMenu) { openMenu.el.remove(); openMenu = null; } }
document.addEventListener('click', (e) => { if (openMenu && !openMenu.el.contains(e.target)) closeMenu(); });
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && openMenu) { const a = document.getElementById(openMenu.anchor); closeMenu(); if (a) a.focus(); }
});

/* ---------- Mass time chips (with language) ---------- */
function timeChip(s, withDay) {
  const past = s.day === todayIdx && s.min < nowMin - 15;
  const kind = typeWord(s.type);
  return `<span class="t${past ? ' past' : ''}">${withDay ? `<b>${dayWord(s.day)}</b>` : ''}${fmtTime(s.min)}` +
    `${s.langs.length ? `<span class="lg">${esc(s.langs.join(', '))}</span>` : ''}` +
    `${kind ? `<span class="vn">${esc(kind)}</span>` : ''}${s.venue ? `<span class="vn">at ${esc(s.venue)}</span>` : ''}</span>`;
}
function shownServices(r) {
  return r.svcs.length ? r.svcs
    : (scheduleActive() ? [] : r.p.services.filter((s) => MASSLIKE.has(s.type)).sort((a, b) => minsUntil(a) - minsUntil(b)));
}

/* ---------- sort switch and results ---------- */
let RESULTS = [];
function renderSort() {
  const mode = sortMode();
  $('#sort').innerHTML = `<button type="button" data-sort="nearest" aria-pressed="${mode === 'nearest'}">Nearest</button><button type="button" data-sort="soonest" aria-pressed="${mode === 'soonest'}">Next Mass</button>`;
  $('#sort').querySelectorAll('button').forEach((b) => b.addEventListener('click', () => {
    if (b.dataset.sort === 'nearest' && !state.origin) {
      state.sort = 'nearest';
      setMsg('To sort by distance, search a town or use your location.');
      $('#locate').click();
      return;
    }
    state.sort = b.dataset.sort; update();
  }));
}
function renderList() {
  const list = $('#list');
  renderSort();
  const n = RESULTS.length;
  const dayText = state.day === 'any' ? '' : state.day === 'today' ? ' with Mass today' : state.day === 'tomorrow' ? ' with Mass tomorrow' : ' with Mass on ' + DAYNAMES[state.day];
  $('#count').textContent = (n === 1 ? '1 parish' : n.toLocaleString('en-IN') + ' parishes') + dayText;
  if (state.selected) { renderDetail(state.selected); return; }
  let html = '';
  if (!state.origin && !scheduleActive() && !state.withTimes) html += `<p class="note">Search a town, area or pincode, or use your location, to see the parishes nearest you.</p>`;
  if (scheduleActive() || state.withTimes) html += `<p class="note">Mass times are listed for ${withTimesCount} of ${parishes.length} parishes so far, so some nearby parishes won’t appear with these filters.</p>`;
  if (!n) {
    html += `<div class="empty"><p>No parishes match these filters.</p><button class="btn" id="resetAll" type="button">Clear filters</button></div>`;
    list.innerHTML = html;
    $('#resetAll').addEventListener('click', resetFilters);
    return;
  }
  html += '<ul class="results">';
  RESULTS.slice(0, state.limit).forEach((r) => {
    const p = r.p, svcs = shownServices(r);
    const times = svcs.length
      ? `<span class="times">${svcs.slice(0, 3).map((s) => timeChip(s, true)).join('')}${svcs.length > 3 ? `<span class="t more">+${svcs.length - 3} more</span>` : ''}</span>`
      : `<span class="nottimes">Mass times not listed yet${p.ph.length ? ', call ' + esc(p.ph[0]) : ''}</span>`;
    html += `<li><button class="card" type="button" data-id="${esc(p.id)}">
      <span class="top"><span><h3>${esc(p.n)}</h3><span class="place">${esc(placeLine(p))}</span></span>${r.d != null ? `<span class="km">${fmtKm(r.d)}</span>` : ''}</span>
      ${times}</button></li>`;
  });
  html += '</ul>';
  if (n > state.limit) html += `<button class="btn moreBtn" id="moreBtn" type="button">Show ${Math.min(50, n - state.limit)} more</button>`;
  list.innerHTML = html;
  list.querySelectorAll('.card').forEach((c) => {
    c.addEventListener('click', () => select(c.dataset.id, true));
    c.addEventListener('mouseenter', () => hilite(c.dataset.id, true));
    c.addEventListener('mouseleave', () => hilite(c.dataset.id, false));
  });
  const more = $('#moreBtn');
  if (more) more.addEventListener('click', () => { state.limit += 50; renderList(); });
}

/* ---------- parish detail ---------- */
function directionsUrl(p) {
  const precise = p.gp === 'exact' || p.gs === 'verified';
  return 'https://www.google.com/maps/dir/?api=1&destination=' + encodeURIComponent(precise ? `${p.lat},${p.lng}` : `${p.n}, ${p.ad || placeLine(p)}`);
}
function renderDetail(p) {
  const list = $('#list');
  const dist = state.origin && p.hasCoords ? km(state.origin, p) : null;
  const precise = p.gp === 'exact' || p.gs === 'verified';
  const tel = p.ph[0] ? p.ph[0].replace(/[^\d+]/g, '') : '';
  const actions = `<a class="btn primary" href="${esc(directionsUrl(p))}" target="_blank" rel="noopener">${ICON.nav}Directions</a>` +
    (tel ? `<a class="btn" href="tel:${esc(tel)}">${ICON.phone}Call</a>` : '') +
    (p.web ? `<a class="btn" href="${esc(p.web)}" target="_blank" rel="noopener">Website</a>` : '');
  const facts = [
    ['Address', [p.ad, p.pin && !String(p.ad || '').replace(/\s/g, '').includes(p.pin) ? p.pin : ''].filter(Boolean).join(', ')],
    ['Phone', p.ph.join(', ')],
    ['Email', p.em && `<a href="mailto:${esc(p.em)}">${esc(p.em)}</a>`],
    ['Patron', p.pt], ['Feast day', p.fd], ['Diocese', p.dio], ['Established', p.est], ['Catholics', p.cat],
  ].filter(([, v]) => v).map(([k, v]) => `<dt>${k}</dt><dd>${k === 'Email' ? v : esc(v)}</dd>`).join('');
  let sched;
  if (p.services.length) {
    const order = [...Array(7)].map((_, i) => (todayIdx + i) % 7);
    sched = '<div class="week">' + order.map((d) => {
      const svcs = p.services.filter((s) => s.day === d).sort((a, b) => a.min - b.min);
      const cells = svcs.length ? svcs.map((s) => {
        const kind = typeWord(s.type) || (s.type !== 'Mass' ? s.type : '');
        const meta = [s.venue && 'At ' + s.venue, s.rec && s.rec !== 'Weekly' && !(s.notes || '').toLowerCase().includes(s.rec.toLowerCase()) ? s.rec : '', s.notes].filter(Boolean).join(', ');
        return `<div class="svc"><span class="tm">${fmtTime(s.min)}</span>` +
          (s.langs.length ? `<span class="lg">${esc(s.langs.join(', '))}</span>` : `<span class="lg none">Language not listed</span>`) +
          (kind ? `<span class="ty">${esc(kind)}</span>` : '') + (meta ? `<span class="mt">${esc(meta)}</span>` : '') + '</div>';
      }).join('') : '<span class="none-day">No services listed</span>';
      return `<div class="day${d === todayIdx ? ' today' : ''}"><span class="dn">${d === todayIdx ? 'Today' : d === (todayIdx + 1) % 7 ? 'Tomorrow' : DAYNAMES[d]}</span><div class="svcs">${cells}</div></div>`;
    }).join('') + '</div>';
  } else {
    sched = `<p class="note" style="margin:0">This parish hasn’t shared its Mass times yet.${p.ph.length ? ' Call the parish office to check.' : ''}</p>`;
  }
  const pinNote = !p.hasCoords ? 'This parish isn’t on the map yet.'
    : precise ? '' : p.gp === 'post_office' ? 'The map pin shows the nearest post office, so the church may be a short distance away.'
    : 'The map pin is approximate, so use the address or directions to find the church.';
  list.innerHTML = `<article class="detail">
    <button class="back" id="back" type="button">${ICON.back}All results</button>
    <div><h2>${esc(p.n)}</h2><p class="sub">${esc(placeLine(p))}${dist != null ? ', ' + fmtKm(dist) + ' away' : ''}</p></div>
    <div class="actions">${actions}</div>
    <p class="label">Mass times</p>${sched}
    <dl class="facts">${facts}</dl>
    ${pinNote ? `<p class="hint">${pinNote}</p>` : ''}
  </article>`;
  $('#back').addEventListener('click', () => select(null));
  list.scrollTop = 0;
}

function select(id, fromList) {
  const p = id ? parishes.find((x) => x.id === id) : null;
  state.selected = p;
  try { history.replaceState(null, '', p ? '#' + p.id : location.pathname + location.search); } catch (e) {}
  renderList(); paintDots();
  if (p && p.hasCoords) ensureVisible(p, fromList === 'map');
  if (!p) closePopup();
  if (p && isPhone()) $('#panel').classList.add('full');
}
window.addEventListener('hashchange', () => {
  const id = location.hash.slice(1);
  if (id && (!state.selected || state.selected.id !== id)) select(id);
});

const isPhone = () => window.matchMedia('(max-width: 760px)').matches;
$('#handle').addEventListener('click', () => $('#panel').classList.toggle('full'));

/* ---------- formatting ---------- */
function fmtTime(min) {
  const h = Math.floor(min / 60), m = min % 60, ap = h < 12 ? 'am' : 'pm', h12 = ((h + 11) % 12) + 1;
  return h12 + (m ? ':' + String(m).padStart(2, '0') : '') + ' ' + ap;
}
function dayWord(d) {
  if (d === todayIdx) return 'Today';
  if (d === (todayIdx + 1) % 7) return 'Tomorrow';
  return DAYSHORT[d];
}
function fmtKm(d) { return d == null ? '' : d < 1 ? '<1 km' : d < 10 ? d.toFixed(1) + ' km' : Math.round(d) + ' km'; }
function placeLine(p) {
  const bits = [p.loc && titleCase(p.loc), p.city, p.dist].filter(Boolean);
  return [...new Set(bits)].join(', ') || p.dio;
}
function typeWord(t) { return t === 'Vigil Mass' ? 'Sunday vigil' : t === 'Mass' ? '' : t; }

/* ---------- map ---------- */
const CFG = Object.assign({ mapStyleUrl: 'https://tiles.openfreemap.org/styles/liberty' }, window.FIND_A_MASS_CONFIG || {});
const KA_BOUNDS = [[73.9, 11.5], [78.7, 18.5]];
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function cssColor(v) {
  const e = document.createElement('i');
  e.style.color = `var(${v})`; document.body.append(e);
  const c = getComputedStyle(e).color; e.remove(); return c;
}
let styleReady = false;
function styleSpec() {
  /* main map: OpenFreeMap vector style (free, no key) */
  if (CFG.mapStyleUrl) return CFG.mapStyleUrl;
  /* backup: OpenStreetMap's standard street map, softened a little so the parish pins stand out */
  return {
    version: 8,
    sources: { osm: { type: 'raster', tiles: ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'], tileSize: 256, maxzoom: 19,
      attribution: '© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors' } },
    layers: [
      { id: 'bg', type: 'background', paint: { 'background-color': cssColor('--sea') } },
      { id: 'osm', type: 'raster', source: 'osm', paint: { 'raster-saturation': -0.35, 'raster-contrast': -0.08, 'raster-brightness-min': 0.06 } },
    ],
  };
}

const map = new maplibregl.Map({
  container: 'map', style: styleSpec(), bounds: KA_BOUNDS, fitBoundsOptions: { padding: mapPadding() },
  attributionControl: { compact: true }, dragRotate: false, pitchWithRotate: false, maxZoom: 19,
});
map.touchZoomRotate.disableRotation();
map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'top-right');
class FitControl {
  onAdd() {
    const d = document.createElement('div');
    d.className = 'maplibregl-ctrl maplibregl-ctrl-group fitctl';
    d.innerHTML = '<button type="button" title="Show all results" aria-label="Show all results">⤢</button>';
    d.querySelector('button').addEventListener('click', () => fitResults());
    return d;
  }
  onRemove() {}
}
map.addControl(new FitControl(), 'top-right');

map.on('error', (e) => {
  if (styleReady || !CFG.mapStyleUrl) return;
  console.warn('Street map style unavailable; switching to the OpenStreetMap backup.', e.error);
  CFG.mapStyleUrl = '';
  map.setStyle(styleSpec(), { diff: false });
});
map.on('style.load', () => { styleReady = true; englishLabels(); addLayers(); });

function englishLabels() {
  if (!CFG.mapStyleUrl) return;
  for (const l of map.getStyle().layers) {
    const tf = l.type === 'symbol' && l.layout && l.layout['text-field'];
    if (tf && JSON.stringify(tf).includes('name')) {
      try { map.setLayoutProperty(l.id, 'text-field', ['coalesce', ['get', 'name:en'], ['get', 'name:latin'], ['get', 'name']]); } catch (e) {}
    }
  }
}

/* data for the map */
const EMPTY = { type: 'FeatureCollection', features: [] };
const fc = (list) => ({ type: 'FeatureCollection', features: list.filter((p) => p.hasCoords).map((p) => ({ type: 'Feature', properties: { id: p.id }, geometry: { type: 'Point', coordinates: [p.lng, p.lat] } })) });
function circlePoly(lat, lng, radiusKm) {
  const pts = [];
  for (let i = 0; i <= 72; i++) {
    const a = (i / 72) * 2 * Math.PI;
    pts.push([lng + (radiusKm / (111.2 * Math.cos(lat * Math.PI / 180))) * Math.sin(a), lat + (radiusKm / 111.2) * Math.cos(a)]);
  }
  return pts;
}
function mapData() {
  const on = new Set(RESULTS.map((r) => r.p.id));
  const filtered = scheduleActive() || state.withTimes || state.origin;
  return {
    results: fc(RESULTS.map((r) => r.p)),
    others: filtered ? fc(parishes.filter((p) => !on.has(p.id))) : EMPTY,
    origin: state.origin ? { type: 'FeatureCollection', features: [{ type: 'Feature', properties: {}, geometry: { type: 'Point', coordinates: [state.origin.lng, state.origin.lat] } }] } : EMPTY,
    radius: state.origin && state.radius ? { type: 'FeatureCollection', features: [{ type: 'Feature', properties: {}, geometry: { type: 'Polygon', coordinates: [circlePoly(state.origin.lat, state.origin.lng, state.radius)] } }] } : EMPTY,
  };
}

function addLayers() {
  const accent = cssColor('--accent'), grey = cssColor('--dot'), ink = cssColor('--ink'), surface = cssColor('--surface');
  const d = mapData();
  map.addSource('radius', { type: 'geojson', data: d.radius });
  map.addLayer({ id: 'radius-fill', type: 'fill', source: 'radius', paint: { 'fill-color': accent, 'fill-opacity': 0.05 } });
  map.addLayer({ id: 'radius-line', type: 'line', source: 'radius', paint: { 'line-color': accent, 'line-width': 1.6, 'line-dasharray': [3, 2] } });
  map.addSource('origin', { type: 'geojson', data: d.origin });
  map.addLayer({ id: 'origin-halo', type: 'circle', source: 'origin', paint: { 'circle-radius': 15, 'circle-color': '#13294B', 'circle-opacity': 0.16 } });
  map.addLayer({ id: 'origin', type: 'circle', source: 'origin', paint: { 'circle-radius': 7, 'circle-color': '#13294B', 'circle-stroke-color': '#ffffff', 'circle-stroke-width': 3 } });
  map.addSource('others', { type: 'geojson', data: d.others });
  map.addLayer({ id: 'others', type: 'circle', source: 'others', paint: {
    'circle-radius': ['interpolate', ['linear'], ['zoom'], 6, 2.5, 14, 6], 'circle-color': grey, 'circle-opacity': 0.9,
    'circle-stroke-color': surface, 'circle-stroke-width': 1 } });
  map.addSource('parishes', { type: 'geojson', data: d.results, cluster: true, clusterRadius: 46, clusterMaxZoom: 13 });
  map.addLayer({ id: 'pts', type: 'circle', source: 'parishes', filter: ['!', ['has', 'point_count']], paint: {
    'circle-radius': ['interpolate', ['linear'], ['zoom'], 6, 5.5, 15, 9], 'circle-color': accent,
    'circle-stroke-color': surface, 'circle-stroke-width': 2 } });
  map.addLayer({ id: 'pts-hl', type: 'circle', source: 'parishes', filter: ['in', ['get', 'id'], ['literal', []]], paint: {
    'circle-radius': ['interpolate', ['linear'], ['zoom'], 6, 9, 15, 13], 'circle-color': cssColor('--gold'),
    'circle-stroke-color': accent, 'circle-stroke-width': 3 } });
  updateHL();
}

/* numbered cluster bubbles (HTML markers, so they work with or without map fonts) */
const clusterMarkers = new Map();
function resetClusters() { clusterMarkers.forEach((m) => m.remove()); clusterMarkers.clear(); }
function syncClusters() {
  if (!styleReady || !map.getSource('parishes') || !map.isSourceLoaded('parishes')) return;
  const seen = new Set();
  for (const f of map.querySourceFeatures('parishes', { filter: ['has', 'point_count'] })) {
    const id = f.properties.cluster_id;
    if (seen.has(id)) continue;
    seen.add(id);
    if (!clusterMarkers.has(id)) {
      const n = f.properties.point_count, coords = f.geometry.coordinates;
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'cluster ' + (n < 10 ? 's' : n < 50 ? 'm' : 'l');
      b.textContent = n; b.setAttribute('aria-label', `${n} parishes here. Zoom in`);
      b.addEventListener('click', (e) => {
        e.stopPropagation();
        map.getSource('parishes').getClusterExpansionZoom(id)
          .then((z) => map.easeTo({ center: coords, zoom: Math.min(z + 0.4, 17), duration: reduceMotion ? 0 : 500 }));
      });
      clusterMarkers.set(id, new maplibregl.Marker({ element: b }).setLngLat(coords).addTo(map));
    }
  }
  for (const [id, m] of clusterMarkers) if (!seen.has(id)) { m.remove(); clusterMarkers.delete(id); }
}
map.on('render', syncClusters);

/* clicking a church opens its card */
for (const layer of ['pts', 'pts-hl', 'others']) {
  map.on('click', layer, (e) => { openPopup(e.features[0].properties.id); });
  map.on('mouseenter', layer, () => { map.getCanvas().style.cursor = 'pointer'; });
  map.on('mouseleave', layer, () => { map.getCanvas().style.cursor = ''; });
}

let popup = null, popupId = null, hoverId = null;
function popupContent(p) {
  const r = RESULTS.find((x) => x.p.id === p.id);
  const svcs = r ? shownServices(r) : p.services.filter((s) => MASSLIKE.has(s.type)).sort((a, b) => minsUntil(a) - minsUntil(b));
  const d = state.origin ? km(state.origin, p) : null;
  const tel = p.ph[0] ? p.ph[0].replace(/[^\d+]/g, '') : '';
  const el = document.createElement('div');
  el.className = 'pop';
  el.innerHTML = `<div><h3>${esc(p.n)}</h3><p class="place">${esc(placeLine(p))}${d != null ? ', ' + fmtKm(d) : ''}</p></div>
    ${p.fd ? `<p class="fd">Feast day: ${esc(p.fd)}</p>` : ''}
    ${svcs.length ? `<div><p class="label" style="margin:0 0 6px">Next Masses</p><div class="times">${svcs.slice(0, 3).map((s) => timeChip(s, true)).join('')}</div></div>`
      : `<p class="nottimes" style="margin:0">Mass times not listed yet</p>`}
    <div class="acts">
      <a class="btn primary" href="${esc(directionsUrl(p))}" target="_blank" rel="noopener">${ICON.nav}Directions</a>
      ${tel ? `<a class="btn icon" href="tel:${esc(tel)}" aria-label="Call the parish">${ICON.phone}</a>` : ''}
      <button class="btn" type="button" data-act="details">${p.services.length ? 'Schedule' : 'Details'}</button>
    </div>`;
  el.querySelector('[data-act="details"]').addEventListener('click', () => select(p.id, true));
  return el;
}
function openPopup(id) {
  const p = parishes.find((x) => x.id === id);
  if (!p || !p.hasCoords) return;
  if (popup && popupId === id) return;
  closePopup();
  popupId = id;
  const pp = new maplibregl.Popup({ offset: 18, maxWidth: '350px', focusAfterOpen: false, closeButton: true, padding: mapPadding() })
    .setLngLat([p.lng, p.lat]).setDOMContent(popupContent(p)).addTo(map);
  pp.on('close', () => { if (popup === pp) { popup = null; popupId = null; updateHL(); } });
  popup = pp;
  updateHL();
}
function closePopup() { if (popup) { const pp = popup; popup = null; popupId = null; pp.remove(); updateHL(); } }
function updateHL() {
  if (!styleReady || !map.getLayer('pts-hl')) return;
  const ids = [hoverId, popupId, state.selected && state.selected.id].filter(Boolean);
  map.setFilter('pts-hl', ['in', ['get', 'id'], ['literal', ids]]);
}
function hilite(id, on) { hoverId = on ? id : null; updateHL(); }
function paintDots() {
  if (!styleReady || !map.getSource('parishes')) return;
  const d = mapData();
  resetClusters();
  map.getSource('parishes').setData(d.results);
  map.getSource('others').setData(d.others);
  map.getSource('radius').setData(d.radius);
  map.getSource('origin').setData(d.origin);
  updateHL();
}
function boundsOf(pts) {
  const xs = pts.map((p) => p[0]), ys = pts.map((p) => p[1]);
  return [[Math.min(...xs), Math.min(...ys)], [Math.max(...xs), Math.max(...ys)]];
}
function mapPadding() {
  if (isPhone()) {
    const sheet = $('#panel').getBoundingClientRect().height;
    return { top: 90, bottom: Math.min(sheet, window.innerHeight * 0.6) + 20, left: 30, right: 30 };
  }
  return { top: 40, bottom: 40, left: $('#panel').getBoundingClientRect().right + 40, right: 90 };
}
function fitResults() {
  let b;
  if (state.origin && state.radius) b = boundsOf(circlePoly(state.origin.lat, state.origin.lng, state.radius));
  else {
    const pts = RESULTS.map((r) => r.p).filter((p) => p.hasCoords).map((p) => [p.lng, p.lat]);
    if (state.origin) pts.push([state.origin.lng, state.origin.lat]);
    b = !pts.length || RESULTS.length === parishes.length ? KA_BOUNDS : boundsOf(pts);
  }
  map.fitBounds(b, { padding: mapPadding(), maxZoom: 14, duration: reduceMotion ? 0 : 700 });
}
function ensureVisible(p, fromMap) {
  if (!fromMap) map.flyTo({ center: [p.lng, p.lat], zoom: Math.max(map.getZoom(), 14.5), padding: mapPadding(), duration: reduceMotion ? 0 : 900 });
  openPopup(p.id);
}
/* ---------- search box ---------- */
const q = $('#q'), sugg = $('#sugg'), sbox = $('#sbox');
let sItems = [], sIdx = -1;
function suggestions(text) {
  const t = text.trim().toLowerCase();
  if (t.length < 2) return [];
  const score = (label) => { const l = label.toLowerCase(); return l.startsWith(t) ? 0 : l.includes(' ' + t) ? 1 : l.includes(t) ? 2 : 9; };
  const pl = PLACES.map((e) => ({ e, s: score(e.label) })).filter((x) => x.s < 9)
    .sort((a, b) => a.s - b.s || b.e.n - a.e.n).slice(0, 6)
    .map(({ e }) => ({ kind: 'place', label: e.label, sub: e.kind === 'area' ? e.sub : e.sub, lat: e.lat, lng: e.lng, n: e.n }));
  const pr = parishes.filter((p) => score(p.n) < 9).sort((a, b) => score(a.n) - score(b.n)).slice(0, 8 - pl.length)
    .map((p) => ({ kind: 'parish', label: p.n, sub: placeLine(p), id: p.id }));
  return pl.concat(pr);
}
function renderSugg() {
  sugg.innerHTML = sItems.map((s, i) => `<li role="option" id="opt${i}" aria-selected="${i === sIdx}" data-i="${i}"><span>${esc(s.label)}</span><small>${esc(s.kind === 'parish' ? 'Parish, ' + s.sub : s.sub + (s.n ? ', ' + s.n + (s.n === 1 ? ' parish' : ' parishes') : ''))}</small></li>`).join('');
  const open = sItems.length > 0;
  sugg.classList.toggle('open', open);
  q.setAttribute('aria-expanded', open ? 'true' : 'false');
  q.setAttribute('aria-activedescendant', sIdx >= 0 ? 'opt' + sIdx : '');
}
function closeSugg() { sItems = []; sIdx = -1; renderSugg(); }
function choose(s) {
  closeSugg();
  if (!s) return;
  setMsg('');
  if (s.kind === 'parish') {
    q.value = s.label; sbox.classList.add('has');
    select(s.id); return;
  }
  q.value = s.label; sbox.classList.add('has');
  setOrigin({ lat: s.lat, lng: s.lng, label: s.label });
}
q.addEventListener('input', () => {
  sbox.classList.toggle('has', !!q.value);
  sItems = suggestions(q.value); sIdx = sItems.length ? 0 : -1; renderSugg();
});
q.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowDown') { e.preventDefault(); if (sItems.length) { sIdx = (sIdx + 1) % sItems.length; renderSugg(); } }
  else if (e.key === 'ArrowUp') { e.preventDefault(); if (sItems.length) { sIdx = (sIdx - 1 + sItems.length) % sItems.length; renderSugg(); } }
  else if (e.key === 'Enter') {
    e.preventDefault();
    if (sItems.length) choose(sItems[Math.max(0, sIdx)]);
    else if (q.value.trim()) setMsg(`No town, area, pincode or parish called “${q.value.trim()}” is in the directory yet. Try a nearby town or the district name.`);
  } else if (e.key === 'Escape') closeSugg();
});
sugg.addEventListener('mousedown', (e) => {
  const li = e.target.closest('li'); if (!li) return;
  e.preventDefault(); choose(sItems[+li.dataset.i]);
});
q.addEventListener('blur', () => setTimeout(closeSugg, 120));
$('#qclear').addEventListener('click', () => {
  q.value = ''; sbox.classList.remove('has'); closeSugg(); setMsg('');
  setOrigin(null); q.focus();
});
function setMsg(t) { $('#msg').textContent = t; }

function setOrigin(o) {
  state.origin = o; state.limit = 50; state.selected = null;
  if (o) state.sort = 'nearest';
  $('#locate').classList.toggle('on', !!(o && o.label === 'your location'));
  try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
  update(true);
}

$('#locate').addEventListener('click', () => {
  if (!navigator.geolocation) { setMsg('This browser can’t share your location. Type a town or area instead.'); return; }
  setMsg('Finding your location…');
  navigator.geolocation.getCurrentPosition((pos) => {
    const o = { lat: pos.coords.latitude, lng: pos.coords.longitude, label: 'your location' };
    const nearest = parishes.filter((p) => p.hasCoords).reduce((m, p) => Math.min(m, km(o, p)), Infinity);
    q.value = 'My location'; sbox.classList.add('has');
    setMsg(nearest > 150 ? 'You seem to be outside Karnataka. The directory covers 7 dioceses in Karnataka for now, so results may be far away.' : '');
    if (state.radius === 25) state.radius = 10;
    setOrigin(o);
  }, (err) => {
    setMsg(err.code === 1 ? 'Location access is blocked. Allow it in your browser settings, or type a town or area instead.'
      : 'Couldn’t get your location. Type a town or area instead.');
  }, { enableHighAccuracy: false, timeout: 10000, maximumAge: 300000 });
});

function resetFilters() {
  state.day = 'any'; state.times.clear(); state.langs.clear(); state.withTimes = false; state.devotions = false;
  if (state.origin && state.radius && state.radius < 100) {
    const steps = [5, 10, 25, 50, 100]; state.radius = steps[steps.indexOf(state.radius) + 1] || 100;
  }
  update(true);
}

/* ---------- main update ---------- */
function update(refit) {
  if (!refit) state.limit = 50;
  if (state.selected && refit !== 'keep') state.selected = null;
  RESULTS = compute();
  renderFilters(); renderList(); paintDots();
  if (refit) fitResults();
}

/* first paint */
requestAnimationFrame(() => {
  update();
  const id = location.hash.slice(1);
  if (id && parishes.some((p) => p.id === id)) select(id);
});
})();
</script>
</body>
</html>
