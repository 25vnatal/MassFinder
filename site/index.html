<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="Find Catholic parishes and Mass times near you in Karnataka. Search by town, pincode, day, time and language.">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⛪</text></svg>">
<title>Find a Mass in Karnataka</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya:wght@500;600;700&family=Alegreya+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="vendor/maplibre-gl/maplibre-gl.css">
<script src="vendor/maplibre-gl/maplibre-gl.js"></script>
<script src="config.js"></script>
<style>
:root {
  color-scheme: light;
  --bg: #F3F5F2; --surface: #FFFFFF; --ink: #1C2230; --muted: #5B6370; --faint: #8A919B;
  --line: #DCE0DA; --sea: #D6E3E7; --land: #FFFFFF; --land2: #E8EAE3; --distline: #D2D7CF;
  --dot: #A3AAB3; --green: #2F6B4F; --violet: #5B3F8C; --gold: #8F6A1C;
  --accent: var(--green);
  --serif: 'Alegreya', Georgia, 'Times New Roman', serif;
  --sans: 'Alegreya Sans', 'Segoe UI', system-ui, -apple-system, sans-serif;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #14181E; --surface: #1C2229; --ink: #E7EAE5; --muted: #A4ABB5; --faint: #7D8590;
    --line: #2E3640; --sea: #10161C; --land: #222A33; --land2: #1A2027; --distline: #333C47;
    --dot: #5E6873; --green: #73B592; --violet: #A88BD8; --gold: #D6AE5C;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #14181E; --surface: #1C2229; --ink: #E7EAE5; --muted: #A4ABB5; --faint: #7D8590;
  --line: #2E3640; --sea: #10161C; --land: #222A33; --land2: #1A2027; --distline: #333C47;
  --dot: #5E6873; --green: #73B592; --violet: #A88BD8; --gold: #D6AE5C;
}
:root[data-season="violet"] { --accent: var(--violet); }
:root[data-season="gold"] { --accent: var(--gold); }
:root { --accent-soft: color-mix(in srgb, var(--accent) 13%, var(--surface)); --accent-line: color-mix(in srgb, var(--accent) 40%, var(--line)); }
*, *::before, *::after { box-sizing: inherit; }
html, body { height: 100%; margin: 0; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body { background: var(--bg); color: var(--ink); font: 16px/1.45 var(--sans); -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
a { color: var(--accent); }

.app {
  height: 100%; display: grid;
  grid-template-columns: minmax(360px, 460px) 1fr;
  grid-template-rows: auto auto 1fr;
  grid-template-areas: "head head" "filt map" "list map";
}

/* header */
.top { grid-area: head; display: flex; align-items: center; gap: 28px; padding: 14px 24px; border-bottom: 1px solid var(--line); background: var(--surface); flex-wrap: wrap; }
.brand { min-width: 220px; }
.brand h1 { font: 700 30px/1.05 var(--serif); margin: 0; letter-spacing: -0.01em; }
.season { margin: 4px 0 0; font-size: 14px; color: var(--muted); display: flex; align-items: center; gap: 7px; }
.season i { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); display: inline-block; }
.where { flex: 1 1 520px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.searchbox { position: relative; flex: 1 1 280px; }
.searchbox input { width: 100%; height: 46px; padding: 0 40px 0 44px; border: 1.5px solid var(--line); border-radius: 23px; background: var(--bg); font-size: 16px; }
.searchbox input:focus { border-color: var(--accent); outline: none; background: var(--surface); }
.searchbox svg.pin { position: absolute; left: 16px; top: 13px; width: 18px; height: 18px; color: var(--muted); }
.searchbox .clear { position: absolute; right: 8px; top: 8px; width: 30px; height: 30px; border: 0; border-radius: 50%; background: transparent; cursor: pointer; color: var(--muted); font-size: 20px; line-height: 1; display: none; }
.searchbox.has .clear { display: block; }
.suggest { position: absolute; z-index: 30; left: 0; right: 0; top: 52px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 12px 32px rgba(20, 30, 40, .16); padding: 6px; margin: 0; list-style: none; display: none; max-height: 340px; overflow: auto; }
.suggest.open { display: block; }
.suggest li { padding: 8px 12px; border-radius: 9px; cursor: pointer; display: flex; justify-content: space-between; gap: 12px; }
.suggest li[aria-selected="true"], .suggest li:hover { background: var(--accent-soft); }
.suggest small { color: var(--muted); white-space: nowrap; }
.btn { height: 46px; padding: 0 18px; border-radius: 23px; border: 1.5px solid var(--line); background: var(--surface); cursor: pointer; display: inline-flex; align-items: center; gap: 8px; font-weight: 500; white-space: nowrap; }
.btn:hover { border-color: var(--accent); }
.btn svg { width: 18px; height: 18px; }
.radius { height: 46px; border-radius: 23px; border: 1.5px solid var(--line); background: var(--surface); padding: 0 14px; }
.radius:disabled { opacity: .45; }
.msg { flex-basis: 100%; margin: 0; font-size: 14px; color: var(--muted); min-height: 0; }
.msg:empty { display: none; }

/* filters */
.filters { grid-area: filt; padding: 16px 24px 12px; border-bottom: 1px solid var(--line); background: var(--surface); }
.fgroup { display: grid; grid-template-columns: 76px 1fr; gap: 6px 10px; align-items: start; margin-bottom: 10px; }
.fgroup > span { font-size: 14px; color: var(--muted); padding-top: 6px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 16px; padding: 4px 12px; font-size: 14.5px; cursor: pointer; line-height: 1.5; }
.chip:hover { border-color: var(--accent-line); }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.chip small { opacity: .7; margin-left: 3px; }
.toggles { display: flex; gap: 18px; flex-wrap: wrap; font-size: 14.5px; margin-top: 4px; }
.toggles label { display: inline-flex; gap: 7px; align-items: center; cursor: pointer; }
.toggles input { accent-color: var(--accent); width: 16px; height: 16px; }

/* results */
.list { grid-area: list; overflow: auto; background: var(--bg); }
.listhead { position: sticky; top: 0; z-index: 2; background: var(--bg); padding: 14px 24px 10px; display: flex; justify-content: space-between; align-items: baseline; gap: 10px; border-bottom: 1px solid var(--line); }
.count { font: 600 18px/1.25 var(--serif); margin: 0; }
.sort { font-size: 14px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
.sort select { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); padding: 3px 6px; }
.note { margin: 12px 24px 0; font-size: 14px; color: var(--muted); }
.results { list-style: none; margin: 0; padding: 8px 12px 24px; }
.card { display: block; width: 100%; text-align: left; border: 0; background: transparent; padding: 14px 12px; border-radius: 12px; cursor: pointer; border-bottom: 1px solid var(--line); }
.card:hover, .card.hot { background: var(--surface); }
.card .row1 { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.card h3 { font: 600 18.5px/1.25 var(--serif); margin: 0; }
.card .km { font-size: 14px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.card .place { font-size: 14.5px; color: var(--muted); margin: 2px 0 8px; }
.times { display: flex; flex-wrap: wrap; gap: 6px; }
.t { font-size: 14px; border-radius: 7px; padding: 2px 8px; background: var(--accent-soft); color: var(--ink); font-variant-numeric: tabular-nums; }
.t b { font-weight: 700; }
.t em { font-style: normal; color: var(--muted); }
.t.past { background: transparent; border: 1px dashed var(--line); color: var(--faint); }
.t.more { background: transparent; color: var(--muted); padding-left: 2px; }
.nottimes { font-size: 14px; color: var(--faint); }
.empty { padding: 36px 24px; text-align: center; color: var(--muted); }
.empty p { margin: 0 0 14px; }
.moreBtn { display: block; margin: 8px auto 24px; }

/* detail */
.detail { padding: 18px 24px 40px; }
.back { border: 0; background: none; color: var(--accent); cursor: pointer; padding: 4px 0; font-weight: 500; display: inline-flex; gap: 6px; align-items: center; }
.detail h2 { font: 700 28px/1.12 var(--serif); margin: 12px 0 4px; }
.detail .sub { color: var(--muted); margin: 0 0 14px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 18px; }
.actions .btn { height: 40px; padding: 0 15px; font-size: 15px; text-decoration: none; color: var(--ink); }
.actions .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.facts { display: grid; grid-template-columns: 110px 1fr; gap: 6px 14px; margin: 0 0 22px; font-size: 15px; }
.facts dt { color: var(--muted); }
.facts dd { margin: 0; overflow-wrap: anywhere; }
.detail h4 { font: 600 19px/1.2 var(--serif); margin: 0 0 8px; }
.week { width: 100%; border-collapse: collapse; font-size: 15px; }
.week th { text-align: left; font-weight: 500; color: var(--muted); padding: 9px 12px 9px 0; vertical-align: top; width: 92px; border-top: 1px solid var(--line); }
.week td { padding: 7px 0; border-top: 1px solid var(--line); }
.week tr.today th { color: var(--accent); font-weight: 700; }
.week tr.today td, .week tr.today th { background: var(--accent-soft); }
.week tr.today th { padding-left: 8px; }
.svc { display: flex; gap: 8px; align-items: baseline; padding: 2px 0; flex-wrap: wrap; }
.svc .tm { font-weight: 700; font-variant-numeric: tabular-nums; min-width: 66px; }
.svc .ty { font-size: 13px; border: 1px solid var(--line); border-radius: 6px; padding: 0 6px; color: var(--muted); }
.svc .mt { color: var(--muted); font-size: 14px; }
.hint { font-size: 14px; color: var(--muted); margin: 10px 0 0; }

/* map */
.mapwrap { grid-area: map; position: relative; background: var(--sea); overflow: hidden; }
#map { position: absolute; inset: 0; }
.cluster { border: 0; padding: 0; cursor: pointer; border-radius: 50%; display: grid; place-items: center; font: 700 14px/1 var(--sans); color: var(--surface);
  background: var(--accent); box-shadow: 0 0 0 5px color-mix(in srgb, var(--accent) 28%, transparent), 0 2px 8px rgba(0, 0, 0, .25); }
.cluster:hover { box-shadow: 0 0 0 8px color-mix(in srgb, var(--accent) 32%, transparent), 0 2px 10px rgba(0, 0, 0, .3); }
.cluster.s { width: 32px; height: 32px; } .cluster.m { width: 40px; height: 40px; font-size: 15px; } .cluster.l { width: 50px; height: 50px; font-size: 16px; }
.maplibregl-popup-content { background: var(--surface); color: var(--ink); border-radius: 14px; padding: 14px 16px 12px; box-shadow: 0 10px 30px rgba(10, 20, 30, .25); font-family: var(--sans); }
.maplibregl-popup-anchor-bottom .maplibregl-popup-tip, .maplibregl-popup-anchor-bottom-left .maplibregl-popup-tip, .maplibregl-popup-anchor-bottom-right .maplibregl-popup-tip { border-top-color: var(--surface); }
.maplibregl-popup-anchor-top .maplibregl-popup-tip, .maplibregl-popup-anchor-top-left .maplibregl-popup-tip, .maplibregl-popup-anchor-top-right .maplibregl-popup-tip { border-bottom-color: var(--surface); }
.maplibregl-popup-anchor-left .maplibregl-popup-tip { border-right-color: var(--surface); }
.maplibregl-popup-anchor-right .maplibregl-popup-tip { border-left-color: var(--surface); }
.maplibregl-popup-close-button { font-size: 20px; width: 30px; height: 30px; color: var(--muted); border-radius: 0 14px 0 8px; }
.pop h3 { font: 600 18px/1.2 var(--serif); margin: 0 22px 2px 0; }
.pop .place { font-size: 14px; color: var(--muted); margin: 0 0 10px; }
.pop .fd { font-size: 13.5px; color: var(--muted); margin: -6px 0 10px; }
.pop .times, .pop .nottimes { margin-bottom: 12px; }
.pop .acts { display: flex; gap: 6px; flex-wrap: wrap; }
.pop .acts a, .pop .acts button { font: 500 14px/1 var(--sans); height: 34px; padding: 0 12px; border-radius: 17px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; }
.pop .acts .primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.fitctl button { font-size: 17px; }
.legend { position: absolute; left: 12px; bottom: 12px; z-index: 2; background: color-mix(in srgb, var(--surface) 92%, transparent); border: 1px solid var(--line); border-radius: 10px; padding: 6px 12px; font-size: 13.5px; color: var(--muted); display: flex; gap: 14px; flex-wrap: wrap; max-width: calc(100% - 140px); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.legend i.c { width: 16px; height: 16px; background: var(--accent); color: var(--surface); font: 700 9px/16px var(--sans); text-align: center; font-style: normal; }
.maplibregl-ctrl-attrib { font-size: 11px; }
.mapnote { position: absolute; top: 12px; left: 12px; z-index: 2; margin: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 6px 12px; font-size: 13.5px; color: var(--muted); max-width: calc(100% - 80px); }
.mapnote:empty { display: none; }
@media (max-width: 600px) { .legend { display: none; } }

@media (max-width: 900px) {
  html, body { height: auto; }
  .app { height: auto; display: flex; flex-direction: column; }
  .top { order: 0; } .filters { order: 1; } .mapwrap { order: 2; } .list { order: 3; }
  .radius:disabled { display: none; }
  .chips { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin-inline: -16px; padding-inline: 16px; padding-bottom: 2px; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; }
  .top { padding: 14px 16px; gap: 12px; }
  .brand h1 { font-size: 26px; }
  .filters { padding: 14px 16px 8px; }
  .fgroup { grid-template-columns: 1fr; gap: 6px; }
  .fgroup > span { padding-top: 0; }
  .mapwrap { height: 56vh; min-height: 300px; border-block: 1px solid var(--line); }
  .list { overflow: visible; }
  .listhead { padding: 12px 16px; top: env(safe-area-inset-top, 0px); }
  .results { padding: 6px 4px 24px; }
  .detail { padding: 16px; }
  .note { margin: 12px 16px 0; }
}
@media (max-width: 520px) {
  .where .btn span { display: none; }
  .where .btn { padding: 0 14px; }
  .facts { grid-template-columns: 1fr; gap: 0 0; }
  .facts dd { margin-bottom: 8px; }
}
@media (prefers-reduced-motion: no-preference) {
  .card { transition: background-color .12s; }
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <h1>Find a Mass</h1>
      <p class="season"><i></i><span id="season"></span></p>
    </div>
    <div class="where" role="search">
      <div class="searchbox" id="sbox">
        <svg class="pin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>
        <input id="q" type="text" autocomplete="off" placeholder="Town, pincode or parish" aria-label="Search by place, pincode or parish name" role="combobox" aria-expanded="false" aria-controls="sugg" aria-autocomplete="list">
        <button class="clear" id="qclear" aria-label="Clear place">×</button>
        <ul class="suggest" id="sugg" role="listbox"></ul>
      </div>
      <button class="btn" id="locate" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
        <span>Use my location</span>
      </button>
      <select class="radius" id="radius" aria-label="Distance" disabled>
        <option value="5">Within 5 km</option>
        <option value="10">Within 10 km</option>
        <option value="25" selected>Within 25 km</option>
        <option value="50">Within 50 km</option>
        <option value="100">Within 100 km</option>
        <option value="0">Any distance</option>
      </select>
      <p class="msg" id="msg" role="status"></p>
    </div>
  </header>

  <section class="filters" aria-label="Filters">
    <div class="fgroup"><span id="l-day">Day</span><div class="chips" id="days" role="group" aria-labelledby="l-day"></div></div>
    <div class="fgroup"><span id="l-time">Time</span><div class="chips" id="times" role="group" aria-labelledby="l-time"></div></div>
    <div class="fgroup"><span id="l-lang">Language</span><div class="chips" id="langs" role="group" aria-labelledby="l-lang"></div></div>
    <div class="toggles">
      <label><input type="checkbox" id="withTimes"> Only parishes with Mass times</label>
      <label><input type="checkbox" id="devotions"> Include adoration and rosary</label>
    </div>
  </section>

  <section class="list" id="list" aria-live="polite"></section>

  <section class="mapwrap" id="mapwrap" aria-label="Map of parishes">
    <div id="map"></div>
    <p class="mapnote" id="mapnote"></p>
    <div class="legend"><span><i class="c">3</i>Group of parishes, click to zoom in</span><span><i style="background:var(--accent)"></i>Parish</span><span id="lg-other"><i style="background:var(--dot)"></i>Doesn’t match filters</span></div>
  </section>
</div>

<script>
(async function () {
'use strict';
const $ = (s) => document.querySelector(s);
$('#list').innerHTML = '<p class="note">Loading parishes…</p>';
let SRC;
try {
  SRC = await fetch('data/parishes.json', { cache: 'no-cache' }).then((r) => { if (!r.ok) throw new Error('parishes.json returned ' + r.status); return r.json(); });
} catch (err) {
  $('#list').innerHTML = '<div class="empty"><p>The parish directory couldn’t be loaded.</p><p>' +
    (location.protocol === 'file:' ? 'Open this page through a web server (see README), not by double-clicking the file.' : 'Check your connection and reload the page.') + '</p></div>';
  console.error(err);
  return;
}
/* convert the published schema (scripts/build_json.py) into the app's working shape */
const DATA = { p: SRC.parishes.map((p) => ({
  id: p.id, n: p.name, pt: p.patron, fd: p.feast_day, dio: p.diocese.name,
  ad: p.address.line, loc: p.address.locality, city: p.address.city, dist: p.address.district,
  pin: p.address.pincode, st: p.address.state,
  lat: p.geo.lat, lng: p.geo.lng, gp: p.geo.precision, gs: p.geo.status,
  ph: p.contact.phones || [], em: p.contact.email, web: p.contact.website,
  est: p.established, cat: p.catholics,
  m: (p.masses || []).map((x) => [x.day.slice(0, 3), x.time, x.type, x.languages || [], x.venue, x.recurrence, x.notes]),
})) };
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const DAYNAMES = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
const DAYSHORT = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const MASSLIKE = new Set(['Mass', 'Vigil Mass', 'Novena']);
const TIMES = [
  { id: 'early', label: 'Before 7 am', from: 0, to: 420 },
  { id: 'morning', label: '7 am – noon', from: 420, to: 720 },
  { id: 'afternoon', label: 'Noon – 5 pm', from: 720, to: 1020 },
  { id: 'evening', label: 'After 5 pm', from: 1020, to: 1440 },
];

/* ---------- liturgical season colours the accent ---------- */
function easter(y) {
  const a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4,
    f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30,
    i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451),
    month = Math.floor((h + l - 7 * m + 114) / 31), day = ((h + l - 7 * m + 114) % 31) + 1;
  return new Date(y, month - 1, day);
}
function season(now) {
  const y = now.getFullYear(), day = 864e5, t = new Date(y, now.getMonth(), now.getDate()).getTime();
  const e = easter(y).getTime();
  const xmas = new Date(y, 11, 25), dow = xmas.getDay();
  const advent = xmas.getTime() - (dow === 0 ? 28 : dow + 21) * day;
  if (t >= xmas.getTime() || t <= new Date(y, 0, 13).getTime()) return ['Christmas season', 'gold'];
  if (t >= advent) return ['Advent', 'violet'];
  if (t >= e - 46 * day && t < e) return ['Lent', 'violet'];
  if (t >= e && t <= e + 49 * day) return ['Easter season', 'gold'];
  return ['Ordinary Time', 'green'];
}
const NOW = new Date();
const [seasonName, seasonColour] = season(NOW);
document.documentElement.dataset.season = seasonColour;
$('#season').textContent = NOW.toLocaleDateString('en-IN', { weekday: 'long', day: 'numeric', month: 'long' }) + ', ' + seasonName;

/* ---------- data prep ---------- */
const parishes = DATA.p.map((p) => {
  const services = p.m.map((m) => {
    const [h, mi] = m[1].split(':').map(Number);

function km(a, b) {

/* ---------- state ---------- */
const state = {
  origin: null, radius: 25, day: 'any', times: new Set(), langs: new Set(),
  devotions: false, withTimes: false, sort: 'auto', selected: null, limit: 50,

const todayIdx = NOW.getDay(), nowMin = NOW.getHours() * 60 + NOW.getMinutes();

function targetDay() {
  if (state.day === 'today') return todayIdx;
  if (state.day === 'tomorrow') return (todayIdx + 1) % 7;

}

}
function svcMatches(s) {
  if (!state.devotions && !MASSLIKE.has(s.type)) return false;
  const td = targetDay();
  if (td != null && s.day !== td) return false;
  if (state.times.size && !TIMES.some((t) => state.times.has(t.id) && s.min >= t.from && s.min < t.to)) return false;
  if (state.langs.size && !s.langs.some((l) => state.langs.has(l))) return false;

function compute() {
  const active = scheduleActive();
  const out = [];
  for (const p of parishes) {
    const svcs = p.services.filter(svcMatches).sort((a, b) => minsUntil(a) - minsUntil(b));
    if ((active || state.withTimes) && !svcs.length) continue;
    let d = null;
    if (state.origin) {
      if (!p.hasCoords) continue;
      d = km(state.origin, p);
      if (state.radius && d > state.radius) continue;

    out.push({ p, svcs, d, next: svcs.length ? minsUntil(svcs[0]) : Infinity });

  const mode = sortMode();
  out.sort(mode === 'nearest' ? (a, b) => a.d - b.d
    : mode === 'soonest' ? (a, b) => a.next - b.next || (a.d ?? 0) - (b.d ?? 0)

}

/* ---------- formatting ---------- */
function fmtTime(min) {

}
function dayWord(d) {

}

  const seen = new Set();
  for (const f of map.querySourceFeatures('parishes', { filter: ['has', 'point_count'] })) {
    const id = f.properties.cluster_id;
    if (seen.has(id)) continue;
    seen.add(id);
    if (!clusterMarkers.has(id)) {
      const n = f.properties.point_count, coords = f.geometry.coordinates;
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'cluster ' + (n < 10 ? 's' : n < 50 ? 'm' : 'l');
      b.textContent = n; b.setAttribute('aria-label', `${n} parishes here. Zoom in`);
      b.addEventListener('click', (e) => {
        e.stopPropagation();
        map.getSource('parishes').getClusterExpansionZoom(id)
          .then((z) => map.easeTo({ center: coords, zoom: Math.min(z + 0.4, 17), duration: reduceMotion ? 0 : 500 }));
      });
      clusterMarkers.set(id, new maplibregl.Marker({ element: b }).setLngLat(coords).addTo(map));
    }
  }
  for (const [id, m] of clusterMarkers) if (!seen.has(id)) { m.remove(); clusterMarkers.delete(id); }
}
map.on('render', syncClusters);

/* clicking a church opens its card */
for (const layer of ['pts', 'pts-hl', 'others']) {
  map.on('click', layer, (e) => { openPopup(e.features[0].properties.id); });
  map.on('mouseenter', layer, () => { map.getCanvas().style.cursor = 'pointer'; });
  map.on('mouseleave', layer, () => { map.getCanvas().style.cursor = ''; });
}

let popup = null, popupId = null, hoverId = null;
function directionsUrl(p) {
  const precise = p.gp === 'exact' || p.gs === 'verified';
  return 'https://www.google.com/maps/dir/?api=1&destination=' + encodeURIComponent(precise ? `${p.lat},${p.lng}` : `${p.n}, ${p.ad || placeLine(p)}`);
}
function popupContent(p) {
  const r = RESULTS.find((x) => x.p.id === p.id);
  const svcs = r && r.svcs.length ? r.svcs
    : (scheduleActive() ? [] : p.services.filter((s) => MASSLIKE.has(s.type)).sort((a, b) => minsUntil(a) - minsUntil(b)));
  const d = state.origin ? km(state.origin, p) : null;
  const times = svcs.length
    ? `<div class="times">${svcs.slice(0, 3).map((s) => {
        const extra = [typeWord(s.type), s.langs.join(', '), s.venue && 'at ' + s.venue].filter(Boolean).join(', ');
        return `<span class="t"><b>${dayWord(s.day)}</b> ${fmtTime(s.min)}${extra ? ' <em>' + esc(extra) + '</em>' : ''}</span>`;
      }).join('')}${svcs.length > 3 ? `<span class="t more">+${svcs.length - 3} more</span>` : ''}</div>`
    : `<div class="nottimes">Mass times not listed yet</div>`;
  const el = document.createElement('div');
  el.className = 'pop';
  el.innerHTML = `<h3>${esc(p.n)}</h3>
    <p class="place">${esc(placeLine(p))}${d != null ? ', ' + fmtKm(d) : ''}</p>
    ${p.fd ? `<p class="fd">Feast day: ${esc(p.fd)}</p>` : ''}
    ${times}
    <div class="acts">
      <button type="button" class="primary" data-act="details">${p.services.length ? 'Mass times and details' : 'Details'}</button>
      <a href="${esc(directionsUrl(p))}" target="_blank" rel="noopener">Directions</a>
      ${p.ph[0] ? `<a href="tel:${esc(p.ph[0].replace(/[^\d+]/g, ''))}">Call</a>` : ''}
    </div>`;
  el.querySelector('[data-act="details"]').addEventListener('click', () => select(p.id, true));
  return el;
}
function openPopup(id) {
  const p = parishes.find((x) => x.id === id);
  if (!p || !p.hasCoords) return;
  if (popup && popupId === id) return;
  closePopup();
  popupId = id;
  const pp = new maplibregl.Popup({ offset: 14, maxWidth: '330px', focusAfterOpen: false, closeButton: true })
    .setLngLat([p.lng, p.lat]).setDOMContent(popupContent(p)).addTo(map);
  pp.on('close', () => { if (popup === pp) { popup = null; popupId = null; updateHL(); } });
  popup = pp;
  updateHL();
}
function closePopup() { if (popup) { const pp = popup; popup = null; popupId = null; pp.remove(); updateHL(); } }
function updateHL() {
  if (!styleReady || !map.getLayer('pts-hl')) return;
  const ids = [hoverId, popupId, state.selected && state.selected.id].filter(Boolean);
  map.setFilter('pts-hl', ['in', ['get', 'id'], ['literal', ids]]);
}
function hilite(id, on) { hoverId = on ? id : null; updateHL(); }
function paintDots() {
  if (!styleReady || !map.getSource('parishes')) return;
  const d = mapData();
  resetClusters();
  map.getSource('parishes').setData(d.results);
  map.getSource('others').setData(d.others);
  map.getSource('radius').setData(d.radius);
  map.getSource('origin').setData(d.origin);
  $('#lg-other').style.display = d.others.features.length ? '' : 'none';
  updateHL();
}
function boundsOf(pts) {
  const xs = pts.map((p) => p[0]), ys = pts.map((p) => p[1]);
  return [[Math.min(...xs), Math.min(...ys)], [Math.max(...xs), Math.max(...ys)]];
}
function fitResults() {
  let b;
  if (state.origin && state.radius) b = boundsOf(circlePoly(state.origin.lat, state.origin.lng, state.radius));
  else {
    const pts = RESULTS.map((r) => r.p).filter((p) => p.hasCoords).map((p) => [p.lng, p.lat]);
    if (state.origin) pts.push([state.origin.lng, state.origin.lat]);
    b = !pts.length || RESULTS.length === parishes.length ? KA_BOUNDS : boundsOf(pts);
  }
  map.fitBounds(b, { padding: 48, maxZoom: 14, duration: reduceMotion ? 0 : 700 });
}
function ensureVisible(p, fromMap) {
  if (!fromMap) map.flyTo({ center: [p.lng, p.lat], zoom: Math.max(map.getZoom(), 14.5), duration: reduceMotion ? 0 : 900 });
  openPopup(p.id);
}

/* ---------- search box ---------- */
const q = $('#q'), sugg = $('#sugg'), sbox = $('#sbox');
let sItems = [], sIdx = -1;
function suggestions(text) {
  const t = text.trim().toLowerCase();
  if (t.length < 2) return [];
  const score = (label) => { const l = label.toLowerCase(); return l.startsWith(t) ? 0 : l.includes(' ' + t) ? 1 : l.includes(t) ? 2 : 9; };
  const pl = PLACES.map((e) => ({ e, s: score(e.label) })).filter((x) => x.s < 9)
    .sort((a, b) => a.s - b.s || b.e.n - a.e.n).slice(0, 6)
    .map(({ e }) => ({ kind: 'place', label: e.label, sub: e.kind === 'area' ? e.sub : e.sub, lat: e.lat, lng: e.lng, n: e.n }));
  const pr = parishes.filter((p) => score(p.n) < 9).sort((a, b) => score(a.n) - score(b.n)).slice(0, 8 - pl.length)
    .map((p) => ({ kind: 'parish', label: p.n, sub: placeLine(p), id: p.id }));
  return pl.concat(pr);
}
function renderSugg() {
  sugg.innerHTML = sItems.map((s, i) => `<li role="option" id="opt${i}" aria-selected="${i === sIdx}" data-i="${i}"><span>${esc(s.label)}</span><small>${esc(s.kind === 'parish' ? 'Parish, ' + s.sub : s.sub + (s.n ? ', ' + s.n + (s.n === 1 ? ' parish' : ' parishes') : ''))}</small></li>`).join('');
  const open = sItems.length > 0;
  sugg.classList.toggle('open', open);
  q.setAttribute('aria-expanded', open ? 'true' : 'false');
  q.setAttribute('aria-activedescendant', sIdx >= 0 ? 'opt' + sIdx : '');
}
function closeSugg() { sItems = []; sIdx = -1; renderSugg(); }
function choose(s) {
  closeSugg();
  if (!s) return;
  setMsg('');
  if (s.kind === 'parish') {
    q.value = s.label; sbox.classList.add('has');
    select(s.id); return;
  }
  q.value = s.label; sbox.classList.add('has');
  setOrigin({ lat: s.lat, lng: s.lng, label: s.label });
}
q.addEventListener('input', () => {
  sbox.classList.toggle('has', !!q.value);
  sItems = suggestions(q.value); sIdx = sItems.length ? 0 : -1; renderSugg();
});
q.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowDown') { e.preventDefault(); if (sItems.length) { sIdx = (sIdx + 1) % sItems.length; renderSugg(); } }
  else if (e.key === 'ArrowUp') { e.preventDefault(); if (sItems.length) { sIdx = (sIdx - 1 + sItems.length) % sItems.length; renderSugg(); } }
  else if (e.key === 'Enter') {
    e.preventDefault();
    if (sItems.length) choose(sItems[Math.max(0, sIdx)]);
    else if (q.value.trim()) setMsg(`No town, area, pincode or parish called “${q.value.trim()}” is in the directory yet. Try a nearby town or the district name.`);
  } else if (e.key === 'Escape') closeSugg();
});
sugg.addEventListener('mousedown', (e) => {
  const li = e.target.closest('li'); if (!li) return;
  e.preventDefault(); choose(sItems[+li.dataset.i]);
});
q.addEventListener('blur', () => setTimeout(closeSugg, 120));
$('#qclear').addEventListener('click', () => {
  q.value = ''; sbox.classList.remove('has'); closeSugg(); setMsg('');
  setOrigin(null); q.focus();
});
function setMsg(t) { $('#msg').textContent = t; }

function setOrigin(o) {
  state.origin = o; state.limit = 50; state.selected = null;
  $('#radius').disabled = !o;
  try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
  update(true);
}
$('#radius').addEventListener('change', (e) => { state.radius = +e.target.value; update(true); });

$('#locate').addEventListener('click', () => {
  if (!navigator.geolocation) { setMsg('This browser can’t share your location. Type a town or area instead.'); return; }
  setMsg('Finding your location…');
  navigator.geolocation.getCurrentPosition((pos) => {
    const o = { lat: pos.coords.latitude, lng: pos.coords.longitude, label: 'your location' };
    const nearest = parishes.filter((p) => p.hasCoords).reduce((m, p) => Math.min(m, km(o, p)), Infinity);
    q.value = 'My location'; sbox.classList.add('has');
    if (nearest > 150) setMsg('You seem to be outside Karnataka. The directory covers 7 dioceses in Karnataka for now, so results may be far away.');
    else setMsg('');
    if (state.radius === 25) { state.radius = 10; $('#radius').value = '10'; }
    setOrigin(o);
  }, (err) => {
    setMsg(err.code === 1 ? 'Location access is blocked. Allow it in your browser settings, or type a town or area instead.'
      : 'Couldn’t get your location. Type a town or area instead.');
  }, { enableHighAccuracy: false, timeout: 10000, maximumAge: 300000 });
});

$('#withTimes').addEventListener('change', (e) => { state.withTimes = e.target.checked; update(); });
$('#devotions').addEventListener('change', (e) => { state.devotions = e.target.checked; update(); });

function resetFilters() {
  state.day = 'any'; state.times.clear(); state.langs.clear(); state.withTimes = false;
  $('#withTimes').checked = false;
  if (state.origin && state.radius && state.radius < 100) {
    const steps = [5, 10, 25, 50, 100]; state.radius = steps[steps.indexOf(state.radius) + 1] || 100; $('#radius').value = String(state.radius);
  }
  update(true);
}

/* ---------- main update ---------- */
function update(refit) {
  if (!refit) state.limit = 50;
  if (state.selected && refit !== 'keep') state.selected = null;
  RESULTS = compute();
  renderChips(); renderList(); paintDots();
  if (refit) fitResults();
}

/* first paint */
requestAnimationFrame(() => {
  update();
  const id = location.hash.slice(1);
  if (id && parishes.some((p) => p.id === id)) select(id);
});
})();
</script>
</body>
